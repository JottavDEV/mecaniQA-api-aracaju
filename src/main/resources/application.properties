spring.application.name=api

# Conexão JDBC com o MySQL (rode database/mecaniqa.sql antes de subir a API).
# Os valores podem ser trocados por variáveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD.
db.url=${DB_URL:jdbc:mysql://localhost:3306/mecaniqa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Maceio}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:root}
